name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, vet, and test
    runs-on: ubuntu-latest
    steps:
      # Keep the checkouts side by side so go.mod's local Kandev SDK
      # replacement (../kandev/apps/backend) resolves on a fresh runner.
      - name: Checkout plugin
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          path: plugin

      - name: Checkout Kandev SDK
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: kdlbs/kandev
          path: kandev
          sparse-checkout: apps/backend

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: "9.15.9"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: plugin/.harness/pnpm-lock.yaml

      - name: Check module files are tidy
        working-directory: plugin
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        working-directory: plugin
        run: |
          test -z "$(gofmt -l ./server)" || { echo "gofmt needed:"; gofmt -l ./server; exit 1; }

      - name: Vet
        working-directory: plugin
        run: make vet

      - name: Test
        working-directory: plugin
        run: make test

      - name: Package current platform
        working-directory: plugin
        run: make package-host

      - name: Install browser harness dependencies
        working-directory: plugin
        run: pnpm --dir .harness install --frozen-lockfile

      - name: Install Chromium
        working-directory: plugin
        run: pnpm --dir .harness exec playwright install --with-deps chromium

      - name: Test browser harness
        working-directory: plugin
        run: make test-harness

      - name: Build package
        working-directory: plugin
        run: make package
